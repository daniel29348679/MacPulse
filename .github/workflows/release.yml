name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build .app and publish release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app bundle
        run: MACPULSE_RELEASE=1 scripts/build-app.sh "$GITHUB_REF_NAME"

      - name: Validate app bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -x MacPulse.app/Contents/MacOS/MacPulse
          plutil -lint MacPulse.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' MacPulse.app/Contents/Info.plist)" = "app.macpulse.MacPulse"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MacPulse.app/Contents/Info.plist)" = "$VERSION"
          codesign --verify --deep --strict MacPulse.app

      - name: Zip
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent MacPulse.app MacPulse-${GITHUB_REF_NAME}.zip
          shasum -a 256 MacPulse-${GITHUB_REF_NAME}.zip > MacPulse-${GITHUB_REF_NAME}.zip.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacPulse-*.zip
            MacPulse-*.zip.sha256
          generate_release_notes: true
          body: |
            ## MacPulse ${{ github.ref_name }}

            Universal binary (arm64 + x86_64), ad-hoc signed.

            ### Install
            1. Download `MacPulse-${{ github.ref_name }}.zip`
            2. Unzip and move `MacPulse.app` to `/Applications`
            3. First launch: right-click → **Open** (Gatekeeper warns about unsigned apps)

            See attached `.sha256` for the checksum.
